name: PR Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Version (prerelease)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

  # ─── Mobile Android Preview ──────────────────────────────────────────

  build-mobile-android:
    name: Build Android APK (preview)
    needs: version
    if: ${{ vars.ENABLE_MOBILE_BUILD == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Prebuild Android
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          APK_PATH=$(find packages/mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK_PATH" "saqr-v${VERSION}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-preview
          path: saqr-v${{ needs.version.outputs.version }}-android.apk
          retention-days: 5

  # ─── Mobile iOS Simulator Preview ────────────────────────────────────

  build-mobile-ios:
    name: Build iOS Simulator (preview)
    needs: version
    if: ${{ vars.ENABLE_MOBILE_BUILD == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Prebuild iOS
        working-directory: packages/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Build for simulator
        working-directory: packages/mobile/ios
        run: |
          xcodebuild -workspace Saqr.xcworkspace -scheme Saqr \
            -sdk iphonesimulator -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package iOS simulator app
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          APP_PATH=$(find packages/mobile/ios/build/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          cd "$(dirname "$APP_PATH")"
          tar czf "saqr-v${VERSION}-ios-simulator.app.tar.gz" "$(basename "$APP_PATH")"

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-preview
          path: packages/mobile/ios/build/Build/Products/Release-iphonesimulator/*.app.tar.gz
          retention-days: 5

  # ─── Mobile Build Comment ────────────────────────────────────────────

  comment-builds:
    name: Comment Build Status
    needs: [version, build-mobile-android, build-mobile-ios, build-desktop-macos, build-desktop-windows, build-desktop-linux]
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert build status comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- saqr-build-preview -->';
            const version = '${{ needs.version.outputs.version }}';
            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';

            const builds = [
              ['Android APK', '${{ needs.build-mobile-android.result }}'],
              ['iOS Simulator', '${{ needs.build-mobile-ios.result }}'],
              ['macOS (.dmg)', '${{ needs.build-desktop-macos.result }}'],
              ['Windows (.exe)', '${{ needs.build-desktop-windows.result }}'],
              ['Linux (.AppImage/.deb)', '${{ needs.build-desktop-linux.result }}'],
            ];

            const rows = builds.map(([name, status]) =>
              `| ${name} | ${icon(status)} ${status} |`
            ).join('\n');

            const body = `${marker}\n## Preview Builds\n\n` +
              `**Version:** \`${version}\`\n\n` +
              `| Platform | Status |\n` +
              `|----------|--------|\n` +
              `${rows}\n\n` +
              `Download from the [prerelease](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}) or [Actions run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ─── Desktop Builds (Tauri) ─────────────────────────────────────────

  build-desktop-macos:
    name: Build Desktop (macOS preview)
    needs: version
    if: ${{ vars.ENABLE_DESKTOP_BUILD == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Build dashboard frontend
        run: pnpm --filter dashboard run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          args: --target aarch64-apple-darwin
          tagName: ""
          releaseName: ""

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-preview
          path: |
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          retention-days: 5

  build-desktop-windows:
    name: Build Desktop (Windows preview)
    needs: version
    if: ${{ vars.ENABLE_DESKTOP_BUILD == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        shell: bash
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Build dashboard frontend
        run: pnpm --filter dashboard run build

      - name: Build Tauri app (NSIS only — MSI rejects pre-release versions)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          args: --bundles nsis
          tagName: ""
          releaseName: ""

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-preview
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 5

  build-desktop-linux:
    name: Build Desktop (Linux preview)
    needs: version
    if: ${{ vars.ENABLE_DESKTOP_BUILD == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Build dashboard frontend
        run: pnpm --filter dashboard run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tauriScript: npx tauri
          tagName: ""
          releaseName: ""

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-preview
          path: |
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 5

  # ─── Server Preview Deploy ──────────────────────────────────────────

  deploy-servers-preview:
    name: Deploy Servers (preview)
    needs: version
    if: ${{ vars.ENABLE_WRANGLER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy sync-server (preview)
        id: deploy-sync
        working-directory: packages/sync-server
        run: |
          OUTPUT=$(npx wrangler deploy --env preview 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          echo "url=${URL:-https://saqr-sync-preview.workers.dev}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin-server (preview)
        id: deploy-admin
        working-directory: packages/admin-server
        run: |
          OUTPUT=$(npx wrangler deploy --env preview 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          echo "url=${URL:-https://saqr-admin-preview.workers.dev}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upsert server preview comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- saqr-server-preview -->';
            const version = '${{ needs.version.outputs.version }}';
            const syncUrl = '${{ steps.deploy-sync.outputs.url }}';
            const adminUrl = '${{ steps.deploy-admin.outputs.url }}';
            const body = `${marker}\n## Server Preview Deploy\n\n` +
              `**Version:** \`${version}\`\n\n` +
              `| Service | URL |\n` +
              `|---------|-----|\n` +
              `| sync-server | ${syncUrl} |\n` +
              `| admin-server | ${adminUrl} |`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ─── Web Client Preview Deploy (Expo Web → Cloudflare Workers) ─────

  deploy-web-preview:
    name: Deploy Web (preview)
    needs: version
    if: ${{ vars.ENABLE_WEB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version
        run: bash scripts/version.sh --pr ${{ github.event.pull_request.number }}

      - name: Export web build
        working-directory: packages/mobile
        run: npx expo export --platform web

      - name: Deploy to Cloudflare Workers (preview)
        id: deploy
        working-directory: packages/mobile
        run: |
          OUTPUT=$(npx wrangler deploy --env preview 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          echo "url=${URL:-https://saqr-web-preview.workers.dev}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upsert web preview comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- saqr-web-preview -->';
            const version = '${{ needs.version.outputs.version }}';
            const webUrl = '${{ steps.deploy.outputs.url }}';
            const body = `${marker}\n## Web Preview\n\n` +
              `**Version:** \`${version}\`\n\n` +
              `${webUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ─── Prerelease ─────────────────────────────────────────────────────

  prerelease:
    name: Create Prerelease
    needs: [version, build-mobile-android, build-mobile-ios, build-desktop-macos, build-desktop-windows, build-desktop-linux, deploy-servers-preview, deploy-web-preview]
    if: ${{ always() && needs.version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create prerelease tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create prerelease with assets
        run: |
          VERSION="v${{ needs.version.outputs.version }}"

          # Collect all asset files
          ASSETS=()
          if [[ -d release-assets ]]; then
            while IFS= read -r file; do
              ASSETS+=("$file")
            done < <(find release-assets -type f \( \
              -name "*.apk" -o \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.exe" -o \
              -name "*.msi" -o \
              -name "*.AppImage" -o \
              -name "*.deb" \
            \))
          fi

          echo "Assets found: ${#ASSETS[@]}"
          printf '  %s\n' "${ASSETS[@]}"

          CMD=(gh release create "$VERSION" --prerelease --title "$VERSION" --generate-notes)
          for asset in "${ASSETS[@]}"; do
            CMD+=("$asset")
          done

          "${CMD[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old prereleases
        run: bash scripts/cleanup-prereleases.sh --keep 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
